name: refui_flutter_web
description: Flutter Web implementation of the RDK Reference UI (accelerator-home-ui)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/splash/
    - assets/images/apps/
    - assets/images/sidePanel/
    - assets/images/topPanel/
    - assets/images/

  fonts:
    - family: Play
      fonts:
        - asset: assets/fonts/Play/Play-Regular.ttf
        - asset: assets/fonts/Play/Play-Bold.ttf
          weight: 700
